name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
          python-version: '3.12'
      - name: Comprobar sintaxis y errores de Python
        run: |
          uv run --no-project --with ruff==0.15.22 ruff check --select E9,F63,F7,F82 strategy
          uv run --no-project python -m compileall -q strategy
      - name: Comprobar rutas del traslado
        run: |
          test -f strategy/app.py
          test -f strategy/requirements.txt
          test -d strategy/docs/plans
          test -d strategy/data
